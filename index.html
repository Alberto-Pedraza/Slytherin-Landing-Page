<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><Title></Title></title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================================
         SECCIÓN DEL CATÁLOGO MÁGICO
    ============================================== -->

    <section class="catalogo-productos">
        <article class="tarjeta-producto" data-id="1">
            <!-- Imagen -->
            <div class="imagen-producto">
                <img src="assets/Varita_Colmillo_Serpiente.png"
                    alt="Varita Colmillo de Serpiente">
            </div>
            <!-- Información del producto -->
            <div class="info-producto">
                <p class="categoria"><strong>CATEGORÍA:</strong> VARITAS </p>
                <h3 class="nombre-producto">
                    Varita Colmillo de Serpiente
                </h3>
                <p class="descripcion-producto">
                    Forjada para magos ambiciosos. Precisión excepcional
                    en duelo y defensa.
                </p>
                <!-- Características -->
                <div class="caracteristicas">
                    <p><strong>Caracteristicas:</strong></p>
                    <p>🌳 <strong>Madera:</strong> Ébano</p>
                    <p>🐍 <strong>Núcleo:</strong> Colmillo de serpiente</p>
                    <p>🛡️ <strong>Especialidad:</strong> Defensa</p>
                    <p>🎖️ <strong>Nivel:</strong> Avanzado</p>
                </div>
                <!-- Precio y stock -->
                <div class="precio-stock">
                    <p class="precio">58 <span>G</span></p>
                    <p class="stock"> <strong>Disponible</strong></p>
                </div>
                <!-- Botón -->
                <button class="boton-carrito" data-id="1">
                    🐍 Agregar al carrito
                </button>
            </div>
        </article>
    </section>
    <!-- =========================================
         FIN SECCIÓN DEL CATÁLOGO MÁGICO
    ============================================== -->

</body>
</html>
